<div class="flex h-screen w-full overflow-hidden bg-[#0a0b10] text-slate-300">
  <app-sidebar [categories]="categories()"
               [activeTabId]="activeTabId()"
               (selectTab)="changeTab($event)">
  </app-sidebar>
  <main class="flex-1 flex flex-col min-w-0 relative overflow-hidden">
    <app-header (onOpenConfig)="openConfig()"></app-header>
    <section class="flex-1 p-8 pt-0 overflow-y-auto custom-scrollbar z-10">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8 items-stretch">
        <app-audio class="lg:col-span-5 flex flex-col"></app-audio>
        <app-xiaomi class="lg:col-span-7 flex flex-col"></app-xiaomi>
      </div>
      <div class="pb-8">
        <app-data-view [activeTabId]="activeTabId()"></app-data-view>
      </div>
    </section>
  </main>
  <app-config *ngIf="isConfigOpen()"
              (onClose)="isConfigOpen.set(false)"
              (onDataChanged)="loadData()"
              class="relative z-[9999]">
  </app-config>
</div>
